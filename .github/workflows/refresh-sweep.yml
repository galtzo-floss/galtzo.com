name: Refresh the rest (daily sweep)

# Everything outside the 24 projects shown on the profile (refresh-project.yml handles those every
# 6 hours): about 9 stalest projects per elapsed hour, so each remaining project is refreshed about once a day.
# Never queries ClickGems; refresh-clickgems.yml owns that.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
          bundler-cache: true
      - name: Install kettle-changelog (reads coverage from release headers)
        run: gem install kettle-changelog --no-document
      - name: Refresh the 10 stalest projects outside the top 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Scheduled runs are skipped often, so size by elapsed time: ~9 projects per hour since the
          # last successful run (min 9, max 60) keeps the ~205 projects outside the top 24 on a daily pace.
          last=$(gh run list --workflow refresh-sweep.yml --status success --limit 1 --json createdAt -q '.[0].createdAt // empty')
          mins=60; [ -n "$last" ] && mins=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 60 ))
          limit=$(( (mins * 9 + 59) / 60 )); [ "$limit" -lt 9 ] && limit=9; [ "$limit" -gt 60 ] && limit=60
          echo "last success ${last:-never}, ${mins} min ago -> refreshing $limit project(s)"
          bundle exec ruby scripts/update_projects -y --only rest:24 --oldest-first --limit "$limit" --no-clickgems
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/_data/projects.yml src/_data/projects_dev.yml src/_data/star_history
          git diff --staged --quiet && exit 0
          git commit -m "data: daily sweep"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
