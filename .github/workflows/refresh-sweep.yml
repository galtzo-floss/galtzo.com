name: Refresh the rest (daily sweep)

# Everything outside the 24 projects shown on the profile (refresh-project.yml handles those every
# 6 hours): the stalest 10 each hour, so each remaining project is refreshed about once a day.
# Never queries ClickGems; refresh-clickgems.yml owns that.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
          bundler-cache: true
      - name: Refresh the 10 stalest projects outside the top 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec ruby scripts/update_projects -y --only rest:24 --oldest-first --limit 10 --no-clickgems
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/_data/projects.yml src/_data/projects_dev.yml
          git diff --staged --quiet && exit 0
          git commit -m "data: daily sweep"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
